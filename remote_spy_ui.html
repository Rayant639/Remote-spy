<style>
/* ─── TOKENS ──────────────────────────────────────────────────── */
/* Layout: fixed header + two-panel split (log list | detail pane) */
:root {
  --bg:         #0a0b0e;
  --bg2:        #0f1117;
  --bg3:        #161922;
  --surface:    #1a1e2a;
  --surface2:   #1f2433;
  --border:     rgba(255,255,255,.07);
  --border2:    rgba(255,255,255,.12);
  --fg:         #e8ecf4;
  --fg2:        #8b93a8;
  --fg3:        #535b6e;
  --fire:       #f97316;
  --fire-dim:   rgba(249,115,22,.15);
  --fire-glow:  rgba(249,115,22,.35);
  --invoke:     #a78bfa;
  --invoke-dim: rgba(167,139,250,.15);
  --invoke-glow:rgba(167,139,250,.35);
  --accent:     #f97316;
  --accent-dim: rgba(249,115,22,.1);
  --green:      #22c55e;
  --green-dim:  rgba(34,197,94,.15);
  --red:        #ef4444;
  --red-dim:    rgba(239,68,68,.15);
  --radius:     8px;
  --font-mono:  'JetBrains Mono', 'Cascadia Code', monospace;
  --font-ui:    'Inter', system-ui, sans-serif;
  color-scheme: dark;
}

/* ─── RESET ───────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--fg);
  display: flex;
  flex-direction: column;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
}

/* ─── SCROLLBAR ───────────────────────────────────────────────── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

/* ─── HEADER ──────────────────────────────────────────────────── */
.header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px;
  height: 52px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
.header-logo {
  display: flex;
  align-items: center;
  gap: 9px;
}
.logo-icon {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, var(--fire) 0%, #fb923c 100%);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 14px var(--fire-glow);
  flex-shrink: 0;
}
.logo-icon svg { width: 15px; height: 15px; fill: #fff; }
.header-title {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .04em;
  color: var(--fg);
}
.header-title span { color: var(--fire); }

.header-sep { flex: 1; }

.ws-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  border-radius: 99px;
  background: var(--surface);
  border: 1px solid var(--border2);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--fg3);
  font-family: var(--font-mono);
  transition: all .3s;
  cursor: default;
}
.ws-pill .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--fg3);
  transition: all .3s;
}
.ws-pill.live { color: var(--green); border-color: var(--green-dim); background: var(--green-dim); }
.ws-pill.live .dot { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse-dot 2s ease infinite; }
.ws-pill.waiting { color: var(--fire); border-color: var(--fire-dim); background: var(--fire-dim); }
.ws-pill.waiting .dot { background: var(--fire); }

@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: .4; }
}

.header-count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg3);
  padding: 0 8px;
}
.header-count strong { color: var(--fg2); font-weight: 600; }

/* ─── TOOLBAR ─────────────────────────────────────────────────── */
.toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 9px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  flex-shrink: 0;
}

.search-wrap {
  position: relative;
  flex: 1;
  max-width: 320px;
}
.search-wrap svg {
  position: absolute;
  left: 10px; top: 50%;
  transform: translateY(-50%);
  width: 13px; height: 13px;
  stroke: var(--fg3);
  pointer-events: none;
}
.search-input {
  width: 100%;
  padding: 6px 10px 6px 32px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 12px;
  outline: none;
  transition: border-color .2s;
}
.search-input:focus { border-color: var(--border2); }
.search-input::placeholder { color: var(--fg3); }

.filter-group {
  display: flex;
  gap: 3px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 3px;
}
.filter-btn {
  padding: 4px 11px;
  border: none;
  border-radius: 5px;
  background: transparent;
  color: var(--fg3);
  font-family: var(--font-ui);
  font-size: 11.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all .15s;
}
.filter-btn:hover { color: var(--fg2); background: var(--surface); }
.filter-btn.active { background: var(--surface2); color: var(--fg); }
.filter-btn.fire.active { color: var(--fire); }
.filter-btn.invoke.active { color: var(--invoke); }

.toolbar-sep { margin: 0 4px; width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }

.btn {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 11px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--fg2);
  font-family: var(--font-ui);
  font-size: 11.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.btn svg { width: 12px; height: 12px; stroke: currentColor; flex-shrink: 0; }
.btn:hover { border-color: var(--border2); color: var(--fg); background: var(--surface2); }
.btn.danger:hover { border-color: var(--red-dim); color: var(--red); background: var(--red-dim); }
.btn.sim:hover { border-color: var(--fire-dim); color: var(--fire); background: var(--fire-dim); }

/* ─── MAIN SPLIT ──────────────────────────────────────────────── */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
  min-height: 0;
}

/* ─── LOG PANEL ───────────────────────────────────────────────── */
.log-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  min-width: 0;
  overflow: hidden;
}
.log-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px 0;
}
.log-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  height: 100%;
  color: var(--fg3);
}
.log-empty svg { width: 36px; height: 36px; stroke: var(--fg3); opacity: .4; }
.log-empty p { font-size: 12.5px; text-align: center; line-height: 1.6; }
.log-empty code { font-family: var(--font-mono); font-size: 11px; color: var(--fg2); }

.log-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: background .1s, border-color .1s;
  position: relative;
}
.log-row:hover { background: var(--surface); }
.log-row.active {
  background: var(--surface);
  border-left-color: var(--fire);
}
.log-row.active.invoke-row { border-left-color: var(--invoke); }

.badge {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .08em;
  padding: 2px 7px;
  border-radius: 4px;
  flex-shrink: 0;
  text-transform: uppercase;
}
.badge.fire { background: var(--fire-dim); color: var(--fire); }
.badge.invoke { background: var(--invoke-dim); color: var(--invoke); }

.row-info { flex: 1; min-width: 0; }
.row-name {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--fg);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row-path {
  font-size: 11px;
  color: var(--fg3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 1px;
}

.row-meta { text-align: right; flex-shrink: 0; }
.row-args {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg3);
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 6px;
  white-space: nowrap;
}
.row-time {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg3);
  margin-top: 2px;
}

/* ─── DETAIL PANEL ────────────────────────────────────────────── */
.detail-panel {
  width: 320px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg2);
  overflow: hidden;
}
.detail-header {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.detail-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--fg3);
  font-family: var(--font-mono);
  margin-bottom: 6px;
}
.detail-name {
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 700;
  color: var(--fg);
  word-break: break-all;
}
.detail-method-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}
.detail-method-badge {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: .06em;
}
.detail-method-badge.fire { background: var(--fire-dim); color: var(--fire); border: 1px solid rgba(249,115,22,.25); }
.detail-method-badge.invoke { background: var(--invoke-dim); color: var(--invoke); border: 1px solid rgba(167,139,250,.25); }
.detail-ts { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg3); }

.detail-body { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }

.detail-section-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--fg3);
  font-family: var(--font-mono);
  margin-bottom: 6px;
}

.detail-path-box {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 9px 11px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg2);
  word-break: break-all;
  line-height: 1.6;
}

.args-list { display: flex; flex-direction: column; gap: 4px; }
.arg-row {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 10px;
}
.arg-idx {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg3);
  padding-top: 1px;
  flex-shrink: 0;
  min-width: 20px;
}
.arg-val {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg);
  word-break: break-all;
  line-height: 1.6;
  flex: 1;
}
.arg-type {
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--invoke);
  background: var(--invoke-dim);
  border-radius: 3px;
  padding: 1px 5px;
  flex-shrink: 0;
  align-self: flex-start;
  margin-top: 1px;
}
.arg-type.number { color: #38bdf8; background: rgba(56,189,248,.12); }
.arg-type.string { color: #4ade80; background: rgba(74,222,128,.12); }
.arg-type.boolean { color: #facc15; background: rgba(250,204,21,.12); }
.arg-type.nil { color: var(--fg3); background: var(--surface); }

.no-args {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg3);
  font-style: italic;
  padding: 6px 0;
}

.detail-actions { display: flex; flex-direction: column; gap: 6px; }
.copy-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--fg2);
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all .15s;
  text-align: left;
  width: 100%;
}
.copy-btn svg { width: 13px; height: 13px; stroke: currentColor; flex-shrink: 0; }
.copy-btn:hover { border-color: var(--border2); color: var(--fg); background: var(--surface2); }
.copy-btn.fire-action { border-color: var(--fire-dim); color: var(--fire); background: var(--fire-dim); }
.copy-btn.fire-action:hover { background: rgba(249,115,22,.22); }
.copy-btn.copied { color: var(--green); border-color: var(--green-dim); background: var(--green-dim); }

.detail-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--fg3);
  padding: 30px 20px;
  text-align: center;
}
.detail-empty svg { width: 32px; height: 32px; stroke: var(--fg3); opacity: .35; }
.detail-empty p { font-size: 12px; line-height: 1.7; }

/* ─── TOAST ───────────────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 99px;
  padding: 7px 16px;
  font-size: 12px;
  font-weight: 500;
  color: var(--fg);
  z-index: 100;
  transition: transform .25s cubic-bezier(.34,1.56,.64,1);
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ─── ANIMATIONS ──────────────────────────────────────────────── */
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.log-row { animation: fadeIn .18s ease both; }

@media (prefers-reduced-motion: reduce) {
  .log-row { animation: none; }
  .toast { transition: none; }
}

/* ─── RESPONSIVE ──────────────────────────────────────────────── */
@media (max-width: 640px) {
  .detail-panel { width: 100%; position: absolute; inset: 0; z-index: 20; display: none; }
  .detail-panel.visible { display: flex; }
  .detail-header { display: flex; flex-direction: column; gap: 0; }
  .detail-back {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--fire); font-weight: 500;
    background: none; border: none; cursor: pointer;
    margin-bottom: 10px; padding: 0;
  }
}
@media (min-width: 641px) {
  .detail-back { display: none; }
}
</style>

<script>
// ─── STATE ─────────────────────────────────────────────────────
const state = {
  remotes: [],
  selected: null,
  filter: 'all',
  search: '',
};

const WS_URL = 'ws://localhost:7272';
let ws = null, wsRetry = 1000, wsTimer = null;

// ─── WS ────────────────────────────────────────────────────────
function connectWS() {
  try { ws = new WebSocket(WS_URL); } catch(e) { scheduleRetry(); return; }
  ws.onopen = () => {
    wsRetry = 1000;
    setPill('live', 'LIVE');
  };
  ws.onclose = () => { scheduleRetry(); setPill('waiting', 'WAITING'); };
  ws.onerror = () => {};
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'remote' && msg.data) addRemote(msg.data);
      else if (msg.type === 'clear') clearAll(true);
    } catch(_) {}
  };
}
function scheduleRetry() {
  clearTimeout(wsTimer);
  wsTimer = setTimeout(() => { connectWS(); wsRetry = Math.min(wsRetry * 1.6, 10000); }, wsRetry);
  setPill('', 'OFFLINE');
}
function setPill(cls, label) {
  const p = document.getElementById('wsPill');
  p.className = 'ws-pill' + (cls ? ' ' + cls : '');
  document.getElementById('wsLabel').textContent = label;
}
connectWS();

// expose for external injection
window.rayanAddRemote = addRemote;

// ─── ADD REMOTE ────────────────────────────────────────────────
function addRemote(data) {
  state.remotes.unshift(data);
  if (state.remotes.length > 500) state.remotes.pop();
  updateCount();
  renderList();
}

// ─── RENDER ────────────────────────────────────────────────────
function renderList() {
  const list = document.getElementById('logList');
  const empty = document.getElementById('emptyState');
  const q = state.search.toLowerCase();

  const filtered = state.remotes.filter(r => {
    if (state.filter === 'fire' && r.method !== 'FireServer') return false;
    if (state.filter === 'invoke' && r.method !== 'InvokeServer') return false;
    if (q && !r.remote.toLowerCase().includes(q) && !r.path.toLowerCase().includes(q)) return false;
    return true;
  });

  if (filtered.length === 0) {
    empty.hidden = false;
    // clear existing rows
    [...list.querySelectorAll('.log-row')].forEach(el => el.remove());
    return;
  }
  empty.hidden = true;

  // rebuild
  const existing = [...list.querySelectorAll('.log-row')];
  existing.forEach(el => el.remove());

  filtered.forEach((r, i) => {
    const isFire = r.method === 'FireServer';
    const div = document.createElement('div');
    div.className = 'log-row' + (isFire ? '' : ' invoke-row') + (state.selected?.id === r.id ? ' active' : '');
    div.style.animationDelay = i < 20 ? `${i * 12}ms` : '0ms';
    div.innerHTML = `
      <span class="badge ${isFire ? 'fire' : 'invoke'}">${isFire ? 'FIRE' : 'INVOKE'}</span>
      <div class="row-info">
        <div class="row-name">${esc(r.remote)}</div>
        <div class="row-path">${esc(shortPath(r.path))}</div>
      </div>
      <div class="row-meta">
        <div class="row-args">${r.argCount ?? (r.args?.length ?? 0)} arg${(r.argCount ?? (r.args?.length ?? 0)) === 1 ? '' : 's'}</div>
        <div class="row-time">${r.time || ''}</div>
      </div>`;
    div.addEventListener('click', () => selectRemote(r));
    list.appendChild(div);
  });
}

function shortPath(p) {
  if (!p) return '';
  const parts = p.split('.');
  if (parts.length <= 3) return p;
  return parts[0] + '.' + parts[1] + '.….' + parts[parts.length - 1];
}

function updateCount() {
  document.getElementById('countNum').textContent = state.remotes.length;
}

// ─── SELECT REMOTE ─────────────────────────────────────────────
function selectRemote(r) {
  state.selected = r;
  renderList();
  renderDetail(r);
  // mobile: show detail panel
  if (window.innerWidth <= 640) {
    document.getElementById('detailPanel').classList.add('visible');
  }
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('visible');
}

function renderDetail(r) {
  const isFire = r.method === 'FireServer';
  document.getElementById('detailEmpty').hidden = true;
  const content = document.getElementById('detailContent');
  content.hidden = false;

  document.getElementById('dName').textContent = r.remote || '—';
  document.getElementById('dPath').textContent = r.path || '—';
  document.getElementById('dTs').textContent = r.time || '—';

  const badge = document.getElementById('dBadge');
  badge.textContent = isFire ? 'FireServer' : 'InvokeServer';
  badge.className = 'detail-method-badge ' + (isFire ? 'fire' : 'invoke');

  const argsEl = document.getElementById('dArgs');
  argsEl.innerHTML = '';
  const args = r.args || [];
  if (args.length === 0) {
    argsEl.innerHTML = '<div class="no-args">No arguments</div>';
  } else {
    args.forEach((a, i) => {
      const div = document.createElement('div');
      div.className = 'arg-row';
      const t = a?.type || typeof a;
      const v = fmtArg(a);
      div.innerHTML = `
        <span class="arg-idx">[${i+1}]</span>
        <span class="arg-val">${esc(v)}</span>
        <span class="arg-type ${t}">${esc(t)}</span>`;
      argsEl.appendChild(div);
    });
  }

  // reset copy buttons
  document.getElementById('copyRaw').className = 'copy-btn';
  document.getElementById('copyRaw').innerHTML = cpIcon() + ' Copy Raw Info';
  document.getElementById('copyExploit').className = 'copy-btn fire-action';
  document.getElementById('copyExploit').innerHTML = playIcon() + ' Copy FireServer Exploit';
}

function fmtArg(a) {
  if (a === null || a === undefined) return 'nil';
  if (typeof a === 'string') return `"${a}"`;
  if (typeof a === 'object' && a.type) {
    if (a.type === 'Instance') return `${a.value} [${a.class}]`;
    if (a.type === 'Vector3') return `Vector3(${a.x}, ${a.y}, ${a.z})`;
    if (a.type === 'CFrame') return `CFrame(${a.x}, ${a.y}, ${a.z})`;
    if (a.type === 'Color3') return `Color3(${a.r}, ${a.g}, ${a.b})`;
    if (a.type === 'EnumItem') return `Enum.${a.value}`;
    if (a.type === 'table') return a.value;
    if (a.value !== undefined) return String(a.value);
  }
  return String(a);
}

function cpIcon() {
  return `<svg viewBox="0 0 16 16" fill="none" stroke-width="1.5" width="13" height="13"><rect x="4" y="4" width="9" height="11" rx="1.5"/><path d="M3 3a1 1 0 0 1 1-1h6l3 3v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V3z"/></svg>`;
}
function playIcon() {
  return `<svg viewBox="0 0 16 16" fill="none" stroke-width="1.5" width="13" height="13"><path d="M4 3h8a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="m6 6 4 2-4 2V6z" fill="currentColor" stroke="none"/></svg>`;
}

// ─── COPY ──────────────────────────────────────────────────────
function copyRaw() {
  const r = state.selected; if (!r) return;
  const args = (r.args || []).map((a,i) => `  [${i+1}] ${fmtArg(a)}`).join('\n');
  const text = `Remote: ${r.remote}\nPath: ${r.path}\nMethod: ${r.method}\nArgs (${r.argCount ?? r.args?.length ?? 0}):\n${args || '  (none)'}\nTime: ${r.time}`;
  docopy(text, 'copyRaw', 'Copied!');
}

function copyExploit() {
  const r = state.selected; if (!r) return;
  const parts = (r.path || '').split('.');
  const svc = parts[1] || 'Workspace';
  const remName = r.remote;
  const args = (r.args || []).map(a => fmtArg(a)).join(', ');
  const snippet =
`local remote = game:GetService("${svc}"):WaitForChild("${remName}")
remote:${r.method}(${args})`;
  doopy(snippet, 'copyExploit', 'Copied!');
  doopy(snippet, 'copyExploit', 'Copied!');
}

function doopy(text, btnId, msg) {
  const btn = document.getElementById(btnId);
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('copied');
    const prev = btn.innerHTML;
    btn.innerHTML = `<svg viewBox="0 0 16 16" fill="none" stroke-width="1.8" width="13" height="13"><path d="M2 9l4 4 8-8" stroke-linecap="round" stroke-linejoin="round"/></svg> ${msg}`;
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = prev; }, 1800);
  }).catch(() => {
    showToast('Copy failed — select text manually');
  });
}

// ─── FILTER / SEARCH ───────────────────────────────────────────
function setFilter(f, btn) {
  state.filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}
document.getElementById('searchInput').addEventListener('input', e => {
  state.search = e.target.value;
  renderList();
});

// ─── CLEAR ─────────────────────────────────────────────────────
function clearAll(silent) {
  state.remotes = [];
  state.selected = null;
  updateCount();
  renderList();
  document.getElementById('detailEmpty').hidden = false;
  document.getElementById('detailContent').hidden = true;
  if (!silent) showToast('Log cleared');
}

// ─── TOAST ─────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ─── UTIL ──────────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
